[project]
name = "gen-manipulation"
version = "0.1.0"
description = "MuJoCo tabletop manipulation with a Franka Panda"
requires-python = ">=3.12"
dependencies = [
    "mink==1.3.0",
    "mujoco==3.17.0",
    "mujoco-mjx==3.17.0",
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
